<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Cuento - Sin vidas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
</head>
<body>
    <div class="pantalla-menu">
        <div class="contenedor-menu">
            <div class="tarjeta" style="text-align: center; padding: 3rem;">
                <div style="font-size: 5rem; margin-bottom: 1rem; animation: pulse 2s ease-in-out infinite;">💔</div>
                <h1>¡Sin vidas!</h1>
                <p style="color: var(--color-texto-suave); margin-bottom: 1rem;">
                    Se te acabaron las vidas. Espera a que se recupere una para seguir jugando.
                </p>

                <div class="contador-vidas" id="contador-vidas">
                    <div class="contador-icono">⏱️</div>
                    <div class="contador-numero" id="contador-numero">{{ progreso.segundos_para_vida }}</div>
                    <div class="contador-etiqueta">segundos para la próxima vida</div>
                </div>

                <div style="margin-top: 2rem;">
                    <p style="font-size: 0.9rem; color: var(--color-texto-suave); margin-bottom: 1rem;">
                        Vidas actuales: <strong style="color: var(--color-error);">{{ progreso.vidas }} / 5</strong>
                    </p>
                    <a href="{{ url_for('menu') }}" class="boton">Volver al menú</a>
                </div>
            </div>
        </div>
    </div>

    <style>
        .contador-vidas {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1.5rem 2.5rem;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid var(--color-primario);
            border-radius: 20px;
            margin: 1rem auto;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .contador-icono { font-size: 2rem; }

        .contador-numero {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: var(--color-secundario);
            line-height: 1;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
        }

        .contador-etiqueta {
            font-size: 0.75rem;
            color: var(--color-texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(34, 211, 238, 0.6); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>

    <script>
        let segundosRestantes = {{ progreso.segundos_para_vida }};

        function actualizarContador() {
            const contador = document.getElementById('contador-numero');
            if (!contador) return;

            if (segundosRestantes > 0) {
                contador.textContent = segundosRestantes;
                segundosRestantes--;
            } else {
                contador.textContent = '0';
                setTimeout(() => {
                    window.location.href = '/menu';
                }, 1500);
            }
        }

        setInterval(actualizarContador, 1000);
    </script>
</body>
</html>
